[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Netlify Forms — the form on /get-in-touch is auto-detected via data-netlify="true"
# No additional config needed, but we set submission redirect here for clarity.

[[redirects]]
  from = "/contact"
  to = "/get-in-touch"
  status = 301
